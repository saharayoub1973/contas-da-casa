name: Avisos da lista de compras

on:
  schedule:
    - cron: "*/5 0-2,10-23 * * *"   # a cada 5 minutos, das 7h à meia-noite (Brasília)
  workflow_dispatch:
    inputs:
      teste:
        description: "Mandar uma notificação de teste da lista de compras"
        type: boolean
        default: true

concurrency:
  group: compras
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: firebase-admin-12-${{ runner.os }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm install --no-save --no-audit --no-fund firebase-admin@12
      - run: node .github/compras.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          TESTE: ${{ inputs.teste }}
          URL_APP: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      # Mantém o agendamento ativo (o GitHub pausa agendamentos após 60 dias sem atividade)
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/compras.yml/enable" || true
        env:
          GH_TOKEN: ${{ github.token }}

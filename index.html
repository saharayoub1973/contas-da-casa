<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contas da Casa</title>
<meta name="theme-color" content="#A9532E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Contas">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Patrick+Hand&display=swap">
<style>
html{color-scheme:light}
html{overscroll-behavior-y:none;background:var(--bg)}
body{margin:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
input,textarea,select{-webkit-user-select:text;user-select:text}
[hidden]{display:none!important}
:root{
  /* Casa de joão-de-barro: papel creme, telha, folha, tijolo */
  --bg:#F5EEE3; --surface:#FFFBF5; --ink:#3A2A1F; --muted:#86705E; --line:#E8DBC9;
  --accent:#3E7C4F; --accent-ink:#FFFBF5; --soft:#F0E5D4;
  --in:#3E8A52; --out:#C2502F; --warn:#C4861A; --save:#3F6EA8;
  --display:"Fredoka","Avenir Next Rounded","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito","Avenir Next",system-ui,sans-serif;
  --hand:"Patrick Hand","Chalkboard SE","Comic Sans MS",cursive;
  --bar:#A9532E; --bar-ink:#FFF6EA; --telha:#A9532E; --leaf:#3E7C4F; --leaf-ink:#FFFBF5; --dot:rgba(140,90,50,.07); --shadow:#E3D4BF;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#1E1712; --surface:#2A211A; --ink:#F2E6D6; --muted:#B39C86; --line:#3B2F26;
  --accent:#7FBF8A; --accent-ink:#1E1712; --soft:#352A21;
  --in:#83CC93; --out:#F08A6C; --warn:#E9B75C; --save:#93B2E2; --bar:#6E3820; --telha:#E39A6A; --leaf:#2D5A39; --leaf-ink:#F2E6D6; --dot:rgba(255,220,180,.035); --shadow:#15100C; color-scheme:dark}}
*{box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:16px 16px;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding:0;min-height:100vh}
.page{max-width:592px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px calc(150px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.appbar{position:sticky;top:0;z-index:8;background:var(--bar);color:var(--bar-ink);
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
  box-shadow:0 1px 0 rgba(0,0,0,.08)}
header.appbar .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.hrow1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:var(--display);font-weight:700;font-size:1.25rem;letter-spacing:0}
.sync{font-size:.75rem;opacity:.8;display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:#B6E3A1}
.sync.off::before{background:#F2C36B}
.mes{display:flex;align-items:center;justify-content:space-between;gap:6px;background:rgba(255,246,234,.14);border-radius:16px;padding:4px}
.mes b{font-family:var(--display);font-weight:600;font-size:1.05rem;text-transform:capitalize;text-align:center;flex:1}
.ib{border:0;background:rgba(255,246,234,.16);color:var(--bar-ink);min-width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:1.15rem;line-height:1;padding:0 8px}
.ib svg{width:20px;height:20px}

.note{font-size:.85rem;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.note.err{color:var(--out);border-color:var(--out)}

.saldo{background:var(--leaf);background-image:linear-gradient(135deg,rgba(255,255,255,.08),transparent 60%);color:var(--leaf-ink);border-radius:22px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 3px 0 var(--shadow)}
.saldo small{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.saldo .big{font-family:var(--display);font-weight:700;font-size:clamp(2.1rem,9vw,2.8rem);line-height:1;letter-spacing:0}
.saldo .msg{font-weight:600;font-size:.92rem}
.bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--leaf-ink) 22%,transparent);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf-ink);border-radius:99px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio div{display:flex;flex-direction:column;gap:2px;min-width:0}
.trio span{font-size:.72rem;opacity:.85}
.trio strong{font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

section.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:0 3px 0 var(--shadow)}
h2{font-family:var(--display);font-weight:600;font-size:1.12rem;margin:0;text-wrap:balance;letter-spacing:.005em}
h3{font-size:.95rem;margin:0}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hrow small{color:var(--muted);font-size:.8rem}
.empty{color:var(--muted);font-size:.9rem;padding:4px 0}
.hint{color:var(--muted);font-size:.8rem}

.cat{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:4px 0;border-radius:8px}
button.cat:active{background:var(--soft)}
.cat .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.cat .t::after{content:" ›";color:var(--muted)}
.cat .v{font-weight:600}
.cat .track{grid-column:1/-1;height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.cat .track i{display:block;height:100%;background:var(--accent);border-radius:99px}
.cat.over .track i{background:var(--out)}
.cat .lim{grid-column:1/-1;font-size:.75rem;color:var(--muted);margin-top:-2px}
.cat.over .lim{color:var(--out);font-weight:600}

.day{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.item{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:9px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .d{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{grid-column:1;font-size:.8rem;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .v{grid-row:1/3;grid-column:2;align-self:center;font-weight:700}
.v.in{color:var(--in)} .v.out{color:var(--out)} .v.sv{color:var(--save)}

.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--ink);white-space:nowrap}
section.card.alerta{border-color:var(--warn);border-width:1.5px}
.alerta .m{display:flex;gap:6px;align-items:center}
.mascote .masc-row{display:grid;grid-template-columns:112px 1fr;gap:12px;align-items:center}
.masc-art svg{width:100%;height:auto;display:block}
.balao{position:relative;background:var(--soft);border-radius:16px;padding:10px 12px;font-family:var(--hand);font-size:1.12rem;line-height:1.25;display:flex;flex-direction:column;gap:2px;min-width:0}
.balao b{font-family:var(--body);font-size:.7rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--telha)}
.balao::before{content:"";position:absolute;left:-8px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:var(--soft);border-left:0}
.masc-seq{align-items:center;border-top:1px dashed var(--line);padding-top:10px}
.dica{display:flex;flex-direction:column;gap:8px}
.dica+.dica{border-top:1px dashed var(--line);padding-top:12px}
.dica p{margin:0;font-family:var(--hand);font-size:1.15rem;line-height:1.3}
.dica-acoes{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lnk.armed{color:var(--out);font-weight:700}
.eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--telha)}
.ninho-card svg{width:100%;max-width:280px;display:block;margin:0 auto}
.nivel-nome{font-family:var(--display);font-weight:700;font-size:1.7rem;text-align:center;line-height:1.1}
.celebra .masc-art{max-width:240px;margin:0 auto;position:relative}
.seq .seq-n{display:flex;align-items:baseline;gap:6px;font-weight:600}
.seq .seq-n b{font-family:var(--display);font-size:1.5rem;font-weight:800}
.seq .seq-n.big b{font-size:2.6rem}
.fogo{font-size:1.2rem}
.dots{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.dots i{aspect-ratio:1;max-width:100%;border-radius:6px;background:var(--soft)}
.dots i.on{background:var(--warn)}
.dots i.hj{outline:2px solid var(--ink);outline-offset:1px}
.nota{font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--accent)}
.nota small{font-size:.8rem;color:var(--muted);font-weight:600}
.chk-list{display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.chk-list div{display:grid;grid-template-columns:1.2em 1fr auto;gap:6px;color:var(--muted)}
.chk-list div.ok{color:var(--ink)}
.chk-list div.ok span{color:var(--in);font-weight:800}
.chk-list small{font-weight:700}
.resumo-link{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;font-weight:600;text-align:left}
.resumo-link b{color:var(--accent)}
.fim-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.fim-row:last-child{border-bottom:0}
.fim-row span:first-child{display:flex;flex-direction:column;min-width:0;font-weight:600}
.fim-row small{font-weight:400;color:var(--muted);font-size:.78rem}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:10px 6px;border-radius:12px;background:var(--bg);min-width:0}
.badge .ic{font-size:1.8rem;line-height:1.2}
.badge b{font-size:.8rem}
.badge small{font-size:.68rem;color:var(--muted);line-height:1.25}
.badge.lock .ic{filter:grayscale(1);opacity:.35}
.badge.lock b{color:var(--muted)}
.celebra{display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;padding-top:8px}
.cel-item{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:14px;padding:12px}
.cel-item .ic{font-size:2.4rem}
.cel-item b{display:block;font-size:1.05rem}
.cel-item small{color:var(--muted)}
.confete{position:absolute;inset:0;pointer-events:none}
.confete i{position:absolute;top:-10px;width:8px;height:12px;border-radius:2px;background:var(--accent);opacity:.9}
.confete i:nth-child(3n){background:var(--warn)} .confete i:nth-child(3n+1){background:var(--save)}
.confete i:nth-child(1){left:0%;animation-delay:0.00s}.confete i:nth-child(2){left:37%;animation-delay:0.12s}.confete i:nth-child(3){left:74%;animation-delay:0.24s}.confete i:nth-child(4){left:11%;animation-delay:0.36s}.confete i:nth-child(5){left:48%;animation-delay:0.48s}.confete i:nth-child(6){left:85%;animation-delay:0.60s}.confete i:nth-child(7){left:22%;animation-delay:0.00s}.confete i:nth-child(8){left:59%;animation-delay:0.12s}.confete i:nth-child(9){left:96%;animation-delay:0.24s}.confete i:nth-child(10){left:33%;animation-delay:0.36s}.confete i:nth-child(11){left:70%;animation-delay:0.48s}.confete i:nth-child(12){left:7%;animation-delay:0.60s}.confete i:nth-child(13){left:44%;animation-delay:0.00s}.confete i:nth-child(14){left:81%;animation-delay:0.12s}.confete i:nth-child(15){left:18%;animation-delay:0.24s}.confete i:nth-child(16){left:55%;animation-delay:0.36s}.confete i:nth-child(17){left:92%;animation-delay:0.48s}.confete i:nth-child(18){left:29%;animation-delay:0.60s}
@media (prefers-reduced-motion:no-preference){.confete i{animation:cai 1.8s ease-in forwards}@keyframes cai{to{transform:translateY(420px) rotate(540deg);opacity:0}}}
.pill.ok{color:var(--in)} .pill.bad{color:var(--out)} .pill.warn{color:var(--warn)}

.yr{display:flex;flex-direction:column;gap:8px}
.yrow{display:grid;grid-template-columns:2.4em 1fr auto;gap:8px;align-items:center;font-size:.85rem}
.yrow .bars{display:flex;flex-direction:column;gap:3px;min-width:0}
.yrow .bars i{display:block;height:7px;border-radius:99px;min-width:2px}
.yrow .bars i.a{background:var(--in)} .yrow .bars i.b{background:var(--out)}
.yrow .s{font-weight:700;text-align:right;min-width:6.5em}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}

.fixa{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.fixa:last-child{border-bottom:0}
.chk{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;grid-row:1/3;font-weight:800;color:var(--accent-ink);padding:0}
.fixa.pago .chk{background:var(--accent);border-color:var(--accent)}
.fixa .n{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fixa.pago .n{color:var(--muted)}
.fixa .m{font-size:.8rem;color:var(--muted);min-width:0}
.fixa .m.late{color:var(--out);font-weight:600}
.fixa .x{grid-row:1/3;grid-column:3}
.lnk{background:none;border:0;color:var(--muted);font-size:.82rem;text-decoration:underline;padding:6px 4px}

.cc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cc-total{font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1.1}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini div{background:var(--bg);border-radius:10px;padding:8px;display:flex;flex-direction:column;min-width:0}
.mini span{font-size:.72rem;color:var(--muted);text-transform:capitalize}
.mini strong{font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.prog{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--save);border-radius:99px}

label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);font-weight:600;min-width:0}
input.in,select.in{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:12px 16px;font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.sm{padding:8px 12px;font-size:.88rem;border-radius:10px}
.btn.danger{background:none;color:var(--out);border:1px solid var(--out)}
.btn.danger.armed{background:var(--out);color:#fff}
.btn:disabled{opacity:.5}
.tg{display:flex;align-items:center;gap:10px;font-weight:600;font-size:.92rem}
.tg input{width:22px;height:22px;accent-color:var(--accent)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:0}
nav.tabs button{background:none;border:0;padding:6px 0 4px;border-radius:12px;font-size:.7rem;font-weight:600;color:var(--muted);min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs svg{width:23px;height:23px}
nav.tabs button[aria-current="page"]{color:var(--telha)}
nav.tabs button[aria-current="page"] svg{stroke-width:2.4}
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;
  border:0;background:var(--bar);color:var(--bar-ink);border-radius:99px;padding:14px 22px;font-family:var(--display);font-weight:600;font-size:1.05rem;box-shadow:0 4px 0 rgba(0,0,0,.18),0 8px 18px rgba(0,0,0,.14)}

.scrim{position:fixed;inset:0;background:rgba(10,20,17,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;max-height:92%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .in2{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:9px;font-weight:700;color:var(--muted)}
.seg button.on[data-v="saida"]{background:var(--out);color:#fff}
.seg button.on[data-v="entrada"]{background:var(--in);color:#fff}
.valor{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);padding:4px 0}
.valor span{font-family:var(--display);font-weight:600;font-size:1.4rem;color:var(--muted)}
.valor input{border:0;background:none;font-family:var(--display);font-weight:700;font-size:2.2rem;width:100%;min-width:0;padding:0;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:7px 12px;font-size:.88rem;font-weight:600}
.chips button.on{background:var(--bar);color:var(--bar-ink);border-color:var(--bar)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1}
.login{position:fixed;inset:0;z-index:30;background:var(--bar);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.login .card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}}}
</style>
</head>
<body>
<header class="appbar"><div class="in">
    <div class="hrow1">
      <div style="display:flex;flex-direction:column;gap:2px"><div class="brand">Contas da Casa</div><span class="sync" id="sync">online</span></div>

/* Guardião: mostra erros e oferece destravar, mesmo se o resto do app falhar */
(function(){
  function box(msg){
    var s=document.getElementById("status");if(!s)return;
    s.hidden=false;s.className="note err";
    s.innerHTML="";var p=document.createElement("div");p.textContent=msg;s.appendChild(p);
    var r=document.createElement("div");r.style.cssText="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px";
    var b1=document.createElement("button");b1.className="btn sm ghost";b1.textContent="Tentar de novo";b1.onclick=function(){location.reload()};
    var b2=document.createElement("button");b2.className="btn sm danger";b2.textContent="Destravar o app";
    b2.onclick=async function(){
      if(!b2.dataset.ok){b2.dataset.ok="1";b2.textContent="Toque de novo para confirmar";return}
      b2.textContent="Limpando…";
      try{var regs=await navigator.serviceWorker.getRegistrations();for(var i=0;i<regs.length;i++)await regs[i].unregister()}catch(e){}
      try{var ks=await caches.keys();for(var j=0;j<ks.length;j++)await caches.delete(ks[j])}catch(e){}
      try{if(indexedDB.databases){var dbs=await indexedDB.databases();for(var k=0;k<dbs.length;k++)if(dbs[k].name)indexedDB.deleteDatabase(dbs[k].name)}}catch(e){}
      try{localStorage.clear()}catch(e){}
      setTimeout(function(){location.reload()},600);
    };
    r.appendChild(b1);r.appendChild(b2);s.appendChild(r);
    var h=document.createElement("div");h.className="hint";h.style.marginTop="8px";h.textContent="Destravar apaga só a cópia guardada neste aparelho (seus dados ficam salvos no Firebase). Depois é preciso entrar com e-mail e senha de novo.";s.appendChild(h);
  }
  window.__fatal=function(m){window.__dead=true;box(m)};
  window.addEventListener("error",function(e){if(!window.__ok)box("Erro ao abrir o app: "+(e.message||"desconhecido"))});
  window.addEventListener("unhandledrejection",function(e){if(!window.__ok)box("Erro ao abrir o app: "+((e.reason&&(e.reason.message||e.reason.code))||"desconhecido"))});
  setTimeout(function(){if(!window.__ok&&!window.__dead)box("O app está demorando para carregar. Verifique a internet. Se continuar assim, toque em “Destravar o app”.")},15000);
})();

<script type="module">
let CFG={};
try{CFG=await import("./config.js")}catch(e){window.__fatal("O arquivo config.js tem um erro de digitação ("+e.message+"). Confira aspas, vírgulas e ponto e vírgula.")}
const {firebaseConfig,emailsPermitidos}=CFG;
const MSG_URL="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";
let initializeApp,getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,query,where,onSnapshot,setDoc,deleteDoc,getDocs;
try{
  const [A,B,C]=await Promise.all([import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"),import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js")]);
  ({initializeApp}=A);({getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}=B);
  ({initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,query,where,onSnapshot,setDoc,deleteDoc,getDocs}=C);
}catch(e){window.__fatal("Não consegui carregar o app. Se estiver sem internet, conecte e abra de novo.")}

/* ================= constantes e utilidades ================= */
const CATS_SAIDA=["Mercado","Moradia","Contas da casa","Transporte","Saúde","Educação","Restaurante/Delivery","Lazer","Vestuário","Assinaturas","Cartão/Dívidas","Presentes","Outros"];
const CATS_ENTRADA=["Salário","Renda extra","Outras entradas"];
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const $=s=>document.querySelector(s);
const fmt=v=>(v<0?"-":"")+"R$ "+Math.abs(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=v=>(v<0?"-":"")+"R$ "+Math.abs(Math.round(v)).toLocaleString("pt-BR");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const r2=n=>Math.round(n*100)/100;
function parseValor(s){s=String(s??"").trim().replace(/[R$\s]/g,"");if(!s)return NaN;
  if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const n=Number(s);return isFinite(n)?r2(n):NaN}
const vIn=v=>v||v===0?String(v).replace(".",","):"";
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const NOW=()=>new Date();
const hoje=()=>{const d=NOW();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const curYm=()=>hoje().slice(0,7);
const ymAdd=(k,n)=>{let [y,m]=k.split("-").map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+"-"+pad(m)};
const lastDay=k=>{const [y,m]=k.split("-").map(Number);return new Date(y,m,0).getDate()};
const addMonths=(ds,n)=>{const k=ymAdd(ds.slice(0,7),n);return k+"-"+pad(Math.min(+ds.slice(8,10),lastDay(k)))};
const ymNome=k=>{const [y,m]=k.split("-").map(Number);return MESES[m-1]+" "+y};
const ymCurto=k=>{const [y,m]=k.split("-").map(Number);return MESES[m-1].slice(0,3)+"/"+String(y).slice(2)};
const dBr=ds=>ds.slice(8,10)+"/"+ds.slice(5,7);
/* fatura em que uma compra cai: mês do vencimento */
function faturaDe(ds,c){const d=+ds.slice(8,10),fech=+c.fech||1,venc=+c.venc||10;
  const close=d<=fech?0:1;const due=venc>fech?close:close+1;return ymAdd(ds.slice(0,7),due)}
function fechamentoDe(k,c){const fech=+c.fech||1,venc=+c.venc||10;const mk=venc>fech?k:ymAdd(k,-1);return mk+"-"+pad(Math.min(fech,lastDay(mk)))}
const vencDe=(k,c)=>k+"-"+pad(Math.min(+c.venc||10,lastDay(k)));

/* ================= estado ================= */
let ym={y:NOW().getFullYear(),m:NOW().getMonth()+1};
const ymKey=()=>ym.y+"-"+pad(ym.m);
let tab=ls.get("tab","mes");if(tab==="ajustes")tab="mes";
let lancs=[],lancsFat=[],lancsMeta=[],fixas=[],cartoes=[],metas=[],pagos={},faturasPg={};
let config={nomes:["Eu","Esposa"],limites:{},avisoDias:3};
let fs=null,fbApp=null,started=false,fixasReady=false,pagosReady=false;
let unY=null,subY=null,unF=null,subF=null;

function setStatus(t,err){if(window.__dead)return;const s=$("#status");if(!t){s.hidden=true;return}s.hidden=false;s.textContent=t;s.classList.toggle("err",!!err)}

/* ================= Firestore ================= */
const col=p=>collection(fs,p);
const newId=p=>doc(col(p)).id;
function bg(p){p.catch(e=>setStatus(e.code==="permission-denied"?"Sem permissão para salvar com este e-mail. Confira as regras do Firestore.":"Erro ao sincronizar ("+(e.code||e.message)+").",true))}
const put=(c,id,data,merge)=>bg(setDoc(doc(fs,c,id),data,merge?{merge:true}:{}));
const del=(c,id)=>bg(deleteDoc(doc(fs,c,id)));
const snapErr=e=>setStatus(e.code==="permission-denied"?"Este e-mail não tem acesso aos dados. Confira as regras do Firestore.":"Erro ao carregar ("+e.code+"). Feche e abra o app.",true);
const docs=s=>s.docs.map(d=>Object.assign({id:d.id},d.data()));

function subAno(){
  if(!fs||subY===ym.y)return;if(unY)unY();subY=ym.y;lancsServer=false;
  unY=onSnapshot(query(col("lanc"),where("data",">=",ym.y+"-01-01"),where("data","<",(ym.y+1)+"-01-01")),s=>{lancs=docs(s);if(!s.metadata.fromCache)lancsServer=true;window.__ok=true;setStatus("");render();jogoTick()},snapErr);
}
function subFatura(){
  if(!fs)return;const k=ymAdd(ymKey()<curYm()?ymKey():curYm(),-1);if(subF===k)return;if(unF)unF();subF=k;
  unF=onSnapshot(query(col("lanc"),where("fatura",">=",k)),s=>{lancsFat=docs(s);render()},snapErr);
}
function startData(){
  onSnapshot(doc(fs,"config","geral"),s=>{if(s.exists()){const d=s.data();config={nomes:(d.nomes&&d.nomes.length?d.nomes:["Eu","Esposa"]),limites:d.limites||{},avisoDias:+d.avisoDias||3}}render()},snapErr);
  onSnapshot(col("fixas"),s=>{fixas=docs(s).sort((a,b)=>(a.dia||99)-(b.dia||99));fixasReady=fixasReady||!s.metadata.fromCache;autoGen();render()},snapErr);
  onSnapshot(col("cartoes"),s=>{cartoes=docs(s).sort((a,b)=>(a.criadoEm||0)-(b.criadoEm||0));render()},snapErr);
  onSnapshot(col("metas"),s=>{metas=docs(s).sort((a,b)=>(a.criadoEm||0)-(b.criadoEm||0));if(!s.metadata.fromCache)jr.metas=true;render();jogoTick()},snapErr);
  onSnapshot(query(col("lanc"),where("tipo","==","meta")),s=>{lancsMeta=docs(s);if(!s.metadata.fromCache)jr.lmeta=true;render();jogoTick()},snapErr);
  onSnapshot(query(col("dias"),where("d",">=",dAdd(hoje(),-370))),s=>{dias={};s.docs.forEach(d=>dias[d.id]=d.data());if(!s.metadata.fromCache)jr.dias=true;jogoTick()},snapErr);
  onSnapshot(col("meses"),s=>{meses={};s.docs.forEach(d=>meses[d.id]=d.data());if(!s.metadata.fromCache)jr.meses=true;jogoTick()},snapErr);
  onSnapshot(col("desafios"),s=>{desafios=docs(s).sort((a,b)=>(b.criadoEm||0)-(a.criadoEm||0));if(!s.metadata.fromCache)jr.desafios=true;jogoTick()},snapErr);
  onSnapshot(col("jogo"),s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());conquistas=Object.assign({},m.conquistas||{});recordes=Object.assign({},m.recordes||{});dicasCfg={off:Object.assign({},(m.dicas||{}).off||{}),adiadas:Object.assign({},(m.dicas||{}).adiadas||{})};if(!s.metadata.fromCache)jr.jogo=true;jogoTick()},snapErr);
  onSnapshot(query(col("lanc"),where("data",">=",dAdd(hoje(),-100))),s=>{lancsRec=docs(s);if(!s.metadata.fromCache)jr.rec=true;jogoTick()},snapErr);
  onSnapshot(col("pagos"),s=>{pagos={};s.docs.forEach(d=>pagos[d.id]=d.data());pagosReady=pagosReady||!s.metadata.fromCache;autoGen();render()},snapErr);
  onSnapshot(col("faturas"),s=>{faturasPg={};s.docs.forEach(d=>faturasPg[d.id]=d.data());render()},snapErr);
  subAno();subFatura();
}

/* ================= recorrentes ================= */
const tried=new Set();
const fixaStatus=(f,k)=>{const v=(pagos[k]||{})[f.id];return v&&v!=="pulado"?v:null};
function autoGen(){
  if(!fixasReady||!pagosReady)return;
  const cur=curYm(),meses=new Set([cur]);if(ymKey()<cur)meses.add(ymKey());
  for(const k of meses)for(const f of fixas){
    if(!f.auto||(f.desde||"0000-00")>k)continue;
    if((pagos[k]||{})[f.id])continue;
    if(k===cur&&NOW().getDate()<(f.dia||1))continue;
    const key=k+"|"+f.id;if(tried.has(key))continue;tried.add(key);
    lancarFixa(f,k,false);
  }
}
function lancarFixa(f,k,manual){
  const id="fx-"+f.id+"-"+k;
  const data=manual&&k===curYm()?hoje():k+"-"+pad(Math.min(f.dia||1,lastDay(k)));
  const tipo=f.tipo==="entrada"?"entrada":"saida";
  const body={data,tipo,valor:+f.valor||0,cat:f.cat||(tipo==="entrada"?"Salário":"Contas da casa"),quem:f.quem||"Casal",desc:f.nome,criadoEm:Date.now(),fixa:f.id};
  const c=tipo==="saida"&&f.cartao&&cartoes.find(x=>x.id===f.cartao);
  if(c){body.cartao=c.id;body.fatura=faturaDe(data,c)}
  put("lanc",id,body);put("pagos",k,{[f.id]:id},true);
}

/* ================= cálculos ================= */
const doMes=(y,m)=>{const p=y+"-"+pad(m);return lancs.filter(l=>(l.data||"").slice(0,7)===p)};
function totais(arr){let e=0,s=0,g=0;for(const l of arr){const v=+l.valor||0;
  if(l.tipo==="entrada")e+=v;else if(l.tipo==="meta")g+=l.mov==="retirar"?-v:v;else s+=v}
  return{e,s,g,saldo:e-s-g}}
const saldoMeta=id=>lancsMeta.filter(l=>l.meta===id).reduce((a,l)=>a+(l.mov==="retirar"?-1:1)*(+l.valor||0),0);
const nomeCartao=id=>(cartoes.find(c=>c.id===id)||{}).nome||"cartão";
const nomeMeta=id=>(metas.find(m=>m.id===id)||{}).nome||"meta";
const quemOpts=()=>[...config.nomes.filter(Boolean),"Casal"];
function findLanc(id){return lancs.find(l=>l.id===id)||lancsFat.find(l=>l.id===id)||lancsMeta.find(l=>l.id===id)}
function sortDesc(arr){return arr.slice().sort((a,b)=>(b.data||"").localeCompare(a.data||"")||(b.criadoEm||0)-(a.criadoEm||0))}

function itemHtml(l){
  let cls="out",sinal="−",tit=l.desc||l.cat,meta=[l.cat];
  if(l.tipo==="entrada"){cls="in";sinal="+"}
  if(l.tipo==="meta"){cls="sv";sinal=l.mov==="retirar"?"←":"→";tit=(l.mov==="retirar"?"Retirou de ":"Guardou em ")+nomeMeta(l.meta);meta=[]}
  if(l.quem)meta.push(l.quem);
  if(l.cartao)meta.push("💳 "+nomeCartao(l.cartao));
  if(l.fixa)meta.push("fixa");
  return `<button class="item" data-a="edit" data-id="${esc(l.id)}"><span class="d">${esc(tit)}</span><span class="m">${esc(meta.join(" · "))}</span><span class="v num ${cls}">${sinal} ${fmt(+l.valor||0)}</span></button>`;
}
function listaPorDia(arr){let last="",h="";for(const l of sortDesc(arr)){if(l.data!==last){last=l.data;const d=new Date(l.data+"T12:00");h+=`<div class="day">${d.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit"})}</div>`}h+=itemHtml(l)}return h}

/* ================= jogo: sequência, desafios, conquistas ================= */
const dAdd=(ds,n)=>{const t=new Date(Date.UTC(+ds.slice(0,4),+ds.slice(5,7)-1,+ds.slice(8,10))+n*864e5);return t.getUTCFullYear()+"-"+pad(t.getUTCMonth()+1)+"-"+pad(t.getUTCDate())};
let dias={},meses={},desafios=[],conquistas={},recordes={},lancsRec=[],lancsServer=false;
const jr={dias:false,meses:false,desafios:false,jogo:false,rec:false,metas:false,lmeta:false};
const jogoPronto=()=>Object.values(jr).every(Boolean)&&fixasReady;
const celebrar=[];

function sequencia(){const h=hoje();let d=dias[h]?h:dAdd(h,-1),n=0;while(dias[d]){n++;d=dAdd(d,-1)}return{n,hojeOk:!!dias[h]}}
function marcarDia(nada){
  const d=hoje();if(dias[d])return;
  dias[d]={d};put("dias",d,Object.assign({d,por:window.__email||"",em:Date.now()},nada?{nada:true}:{}));
}
function todosLancs(){const m=new Map();for(const l of lancs)m.set(l.id,l);for(const l of lancsRec)m.set(l.id,l);return [...m.values()]}

function atualizarMeses(){
  if(!jr.meses)return;
  const cur=curYm(),fontes=[],feitos=new Set();
  if(jr.rec){const ini=dAdd(hoje(),-100);fontes.push({arr:lancsRec,ok:k=>k+"-01">=ini})}
  if(lancsServer)fontes.push({arr:lancs,ok:k=>k.slice(0,4)===String(subY)});
  for(const f of fontes){
    const ks=new Set(f.arr.map(l=>(l.data||"").slice(0,7)));
    for(const k of ks){
      if(!k||k>=cur||!f.ok(k)||feitos.has(k))continue;feitos.add(k);
      const t=totais(f.arr.filter(l=>(l.data||"").slice(0,7)===k));
      const novo={e:r2(t.e),s:r2(t.s),g:r2(t.g),saldo:r2(t.saldo)},o=meses[k];
      if(!o||o.e!==novo.e||o.s!==novo.s||o.g!==novo.g){meses[k]=novo;put("meses",k,novo)}
    }
  }
}

/* --- desafios --- */
const TIPOS_D=[["limite_cat","Gastar no máximo X numa categoria"],["sem_cat","Ficar sem gastar numa categoria"],["total","Gastar no máximo X no total"],["guardar","Guardar X nas metas"],["registrar","Registrar todos os dias"]];
function tituloDesafio(v){
  const val=parseValor(v.valor);
  return v.tipo==="limite_cat"?`${v.cat} até ${fmt0(val||0)}`:v.tipo==="sem_cat"?`Sem ${v.cat}`:v.tipo==="total"?`Gastar até ${fmt0(val||0)}`:v.tipo==="guardar"?`Guardar ${fmt0(val||0)}`:"Registrar todo dia";
}
function avaliarDesafio(dz,ignorarStatus){
  const h=hoje(),ini=dz.inicio,fim=dz.fim,acabou=h>fim;
  const totalDias=diffDias(fim,ini)+1,passados=Math.max(0,Math.min(totalDias,diffDias(h,ini)+1));
  const ls_=todosLancs().filter(l=>l.data>=ini&&l.data<=fim);
  let atual=0,alvo=+dz.valor||0,estado="andamento",pct=0,txt="";
  if(dz.tipo==="limite_cat"||dz.tipo==="total"){
    atual=ls_.filter(l=>l.tipo==="saida"&&(dz.tipo==="total"||l.cat===dz.cat)).reduce((a,l)=>a+(+l.valor||0),0);
    pct=alvo?Math.min(100,atual/alvo*100):0;
    if(atual>alvo+0.001)estado="falhou";else if(acabou)estado="conseguiu";
    txt=`${fmt(atual)} de ${fmt(alvo)}`+(estado==="andamento"?` · ainda pode ${fmt(alvo-atual)}`:"");
  }else if(dz.tipo==="sem_cat"){
    atual=ls_.filter(l=>l.tipo==="saida"&&l.cat===dz.cat).length;
    pct=passados/totalDias*100;
    if(atual>0)estado="falhou";else if(acabou)estado="conseguiu";
    txt=atual>0?`${atual} gasto${atual>1?"s":""} com ${dz.cat}`:`${passados} de ${totalDias} dias sem gastar`;
  }else if(dz.tipo==="guardar"){
    atual=ls_.filter(l=>l.tipo==="meta").reduce((a,l)=>a+(l.mov==="retirar"?-1:1)*(+l.valor||0),0);
    pct=alvo?Math.max(0,Math.min(100,atual/alvo*100)):0;
    if(atual>=alvo-0.001)estado="conseguiu";else if(acabou)estado="falhou";
    txt=`${fmt(Math.max(0,atual))} de ${fmt(alvo)}`;
  }else{
    let ok=0,falha=false;for(let i=0;i<passados;i++){const d=dAdd(ini,i);if(dias[d])ok++;else if(d<h)falha=true}
    atual=ok;pct=ok/totalDias*100;
    if(falha)estado="falhou";else if(acabou)estado="conseguiu";
    txt=`${ok} de ${totalDias} dias registrados`;
  }
  if(dz.status&&!ignorarStatus)estado=dz.status;
  return{atual,alvo,estado,pct,txt,totalDias,restam:Math.max(0,diffDias(fim,h))};
}
function finalizarDesafios(){
  if(!(jr.rec&&jr.dias&&jr.desafios))return;
  for(const dz of desafios){if(dz.status)continue;const a=avaliarDesafio(dz,true);
    if(a.estado!=="andamento"){dz.status=a.estado;put("desafios",dz.id,{status:a.estado,finalEm:hoje()},true)}}
}
function sugestao(tipo,cat){
  const cur=curYm(),fechados=[1,2,3].map(n=>ymAdd(cur,-n));
  const arr=todosLancs().filter(l=>l.tipo==="saida"&&fechados.includes((l.data||"").slice(0,7)));
  const meses_=new Set(arr.map(l=>l.data.slice(0,7))).size||1;
  const r10=v=>Math.max(10,Math.round(v/10)*10);
  if(tipo==="limite_cat"){const s=arr.filter(l=>l.cat===cat).reduce((a,l)=>a+(+l.valor||0),0)/meses_;return s>0?r10(s*0.9):""}
  if(tipo==="total"){const ks=Object.keys(meses).filter(k=>k<cur).sort().slice(-3);const m=ks.length?ks.reduce((a,k)=>a+meses[k].s,0)/ks.length:0;return m>0?r10(m*0.95):""}
  if(tipo==="guardar")return 200;
  return "";
}

function ctxJogo(){
  const seq=sequencia(),cur=curYm(),ks=Object.keys(meses).filter(k=>k<cur).sort();

  for(const k of ks){run=azul(k)?(prev&&ymAdd(prev,1)===k&&azul(prev)?run+1:1):0;maxRun=Math.max(maxRun,run);
    const p=meses[ymAdd(k,-1)];if(p&&p.s>0&&meses[k].s>0&&meses[k].s<p.s)menos=true;prev=k}
  const ult=ks.slice(-6).filter(k=>meses[k].s>0),media=ult.length?ult.reduce((a,k)=>a+meses[k].s,0)/ult.length:0;
  const guardado=metas.reduce((a,m)=>a+saldoMeta(m.id),0);
  let fatEmDia=0;for(const k of Object.keys(faturasPg)){const m=faturasPg[k]||{};for(const c of cartoes){if(m[c.id]&&m[c.id+"_em"]&&m[c.id+"_em"]<=vencDe(k,c))fatEmDia++}}
  let contasEmDia=0;for(const l of todosLancs()){if(!l.fixa||l.tipo!=="saida"||!String(l.id).startsWith("fx-"))continue;const f=fixas.find(x=>x.id===l.fixa);
    if(f&&!f.auto&&f.dia&&l.data<=l.data.slice(0,7)+"-"+pad(Math.min(f.dia,lastDay(l.data.slice(0,7)))))contasEmDia++}
  return{melhor:Math.max(seq.n,+recordes.melhorSeq||0),maxRun,menos,media,guardado,

}

function notaMes(k){
  const m=meses[k];if(!m)return null;
  const pk=ymAdd(k,-1),p=meses[pk],it=[];let n=0;
  const azul=m.e>0&&m.e-m.s>=0;if(azul)n+=3;it.push([azul,"Entrou mais do que saiu",3]);
  const g=m.g>0;if(g)n+=2;it.push([g,"Guardou dinheiro nas metas",2]);
  const menos=!!(p&&p.s>0&&m.s<p.s);if(menos)n+=2;it.push([menos,"Gastou menos que em "+MESES[+pk.slice(5)-1],2]);
  const tot=lastDay(k);let reg=0;for(let d=1;d<=tot;d++)if(dias[k+"-"+pad(d)])reg++;
  n+=3*reg/tot;it.push([reg/tot>=0.8,`Registrou em ${reg} de ${tot} dias`,3]);
  return{nota:Math.round(n*10)/10,it,m,p,pk};
}

let dicasCfg={off:{},adiadas:{}},dicasAtuais=[];
const normD=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\(\d+\/\d+\)/,"").replace(/\s+/g," ").trim();
const r10=v=>Math.max(10,Math.round(v/10)*10);
function calcDicas(){
  const out=[],h=hoje(),cur=curYm(),dia=+h.slice(8),nd=lastDay(cur);
  const all=todosLancs(),doM=k=>all.filter(l=>(l.data||"").slice(0,7)===k);
  const mes=doM(cur),saidas=mes.filter(l=>l.tipo==="saida");
  const fech=[1,2,3].map(n=>ymAdd(cur,-n)),ant=all.filter(l=>l.tipo==="saida"&&fech.includes((l.data||"").slice(0,7)));
  const nAnt=new Set(ant.map(l=>l.data.slice(0,7))).size;
  const variavel=l=>!l.fixa&&!(l.parcela&&l.parcela.i>1);
  const tM=totais(mes);
  const abertasE=fixas.filter(f=>f.tipo==="entrada"&&!fixaStatus(f,cur)).reduce((a,f)=>a+(+f.valor||0),0);
  const abertasS=fixas.filter(f=>f.tipo!=="entrada"&&!fixaStatus(f,cur)).reduce((a,f)=>a+(+f.valor||0),0);
  const renda=tM.e+abertasE;
  // 1. projeção do mês
  const prevDescs=new Set(all.filter(l=>l.tipo==="saida"&&(l.data||"").slice(0,7)===ymAdd(cur,-1)).map(l=>normD(l.desc)).filter(Boolean));
  const ritmo=l=>variavel(l)&&!l.parcela&&!["Moradia","Contas da casa","Cartão/Dívidas","Educação","Saúde"].includes(l.cat)&&!(renda>0&&+l.valor>=renda*.1)&&!(normD(l.desc)&&prevDescs.has(normD(l.desc)));
  if(dia>=7&&renda>0){
    const varS=saidas.filter(ritmo).reduce((a,l)=>a+(+l.valor||0),0),fixoS=tM.s-varS;
    const proj=fixoS+abertasS+varS/dia*nd;
    if(proj>renda)out.push({id:"proj",prio:100,txt:`No ritmo atual, os gastos do mês chegam a ${fmt0(proj)}: ${fmt0(proj-renda)} acima do que entra.`,acao:{t:"desafio",lbl:"Criar desafio",v:{tipo:"total",valor:vIn(r10(renda*.95)),per:"mes"}}});
    else if(renda-proj>renda*.1&&dia<=25)out.push({id:"sobra",prio:20,txt:`No ritmo atual, sobram uns ${fmt0(renda-proj)} no fim do mês. Que tal já guardar uma parte nas metas?`,acao:{t:"metas",lbl:"Ir para Metas"}});
  }
  // 2. categoria acima da média
  if(nAnt>=1){
    const cats=[...new Set(saidas.map(l=>l.cat))].filter(c=>!["Moradia","Contas da casa","Cartão/Dívidas"].includes(c));
    const lista=[];
    for(const c of cats){const avg=ant.filter(l=>l.cat===c&&variavel(l)).reduce((a,l)=>a+(+l.valor||0),0)/nAnt;
      const doCat=saidas.filter(l=>l.cat===c&&variavel(l)),at=doCat.reduce((a,l)=>a+(+l.valor||0),0);
      if(avg<50)continue;
      if(at>avg*1.2)lista.push({c,avg,at,pct:Math.round((at/avg-1)*100),ja:true});
      else if(dia>=7&&dia<=22&&doCat.length>=3&&at/dia*nd>avg*1.3)lista.push({c,avg,at,pct:Math.round((at/dia*nd/avg-1)*100),ja:false})}
    lista.sort((a,b)=>(b.at-b.avg)-(a.at-a.avg)).slice(0,2).forEach(x=>out.push({id:"cat-"+x.c,prio:x.ja?80:60,
      txt:x.ja?`${x.c} já passou ${x.pct}% da média de um mês inteiro (${fmt0(x.at)} contra ${fmt0(x.avg)}).`:`No ritmo atual, ${x.c} fecha o mês uns ${x.pct}% acima da média (${fmt0(x.avg)}).`,
      itens:saidas.filter(l=>l.cat===x.c),acao:{t:"desafio",lbl:"Segurar até o fim do mês",v:{tipo:"limite_cat",cat:x.c,valor:vIn(r10(x.avg/nd*(nd-dia+1))),per:"mes"}}}));
  }
  // 3. gastinhos
  const peq=saidas.filter(l=>variavel(l)&&+l.valor<30);
  if(peq.length>=8)out.push({id:"gastinhos",prio:50,txt:`${peq.length} gastos abaixo de R$ 30 este mês somaram ${fmt0(peq.reduce((a,l)=>a+(+l.valor||0),0))}. Os gastinhos somam!`,itens:peq});
  // 4. fim de semana
  const ini60=dAdd(h,-60),lz=all.filter(l=>l.tipo==="saida"&&l.data>=ini60&&["Lazer","Restaurante/Delivery"].includes(l.cat));
  const totLz=lz.reduce((a,l)=>a+(+l.valor||0),0),fds=lz.filter(l=>[5,6,0].includes(new Date(l.data+"T12:00").getDay()));
  const totF=fds.reduce((a,l)=>a+(+l.valor||0),0);
  if(totLz>=150&&totF/totLz>=.55)out.push({id:"fds",prio:35,txt:`${Math.round(totF/totLz*100)}% do que vocês gastaram com lazer e delivery nos últimos 2 meses foi de sexta a domingo. Combinar o fim de semana antes ajuda.`,itens:fds});

  all.filter(l=>l.tipo==="saida"&&l.data>=ini4&&variavel(l)&&!l.parcela&&normD(l.desc).length>=3).forEach(l=>{(grupos[normD(l.desc)]=grupos[normD(l.desc)]||[]).push(l)});
  const nomesFixas=fixas.map(f=>normD(f.nome));
  for(const [k,arr] of Object.entries(grupos)){
    const ms=new Set(arr.map(l=>l.data.slice(0,7)));if(ms.size<2||nomesFixas.includes(k))continue;
    if(!ms.has(cur)&&!ms.has(ymAdd(cur,-1)))continue;
    const vs=arr.map(l=>+l.valor).sort((a,b)=>a-b),med=vs[Math.floor(vs.length/2)];
    if(!vs.every(v=>Math.abs(v-med)<=med*.15)||ms.size<arr.length*0.6)continue;

    out.push({id:"ass-"+k,prio:45,txt:`“${ult.desc}” aparece todo mês (${fmt(med)}). Se for assinatura, cadastre como conta fixa, ou veja se ainda vale a pena.`,itens:arr,
      acao:{t:"fixa",lbl:"Cadastrar como fixa",v:{tipo:"saida",nome:ult.desc,valor:vIn(med),dia:String(+ult.data.slice(8)),cat:ult.cat,quem:"Casal",cartao:ult.cartao||"",auto:!!ult.cartao}}});
    if(out.filter(d=>d.id.startsWith("ass-")).length>=2)break;
  }
  // 6. conta fixa que subiu
  for(const f of fixas.filter(f=>f.tipo!=="entrada")){
    const l=mes.find(x=>x.fixa===f.id);if(!l)continue;
    const prev=ant.filter(x=>x.fixa===f.id);if(!prev.length)continue;
    const avg=prev.reduce((a,x)=>a+(+x.valor||0),0)/prev.length;
    if(+l.valor>avg*1.2&&+l.valor-avg>=15)out.push({id:"fixa-"+f.id,prio:55,txt:`${f.nome} veio ${Math.round((l.valor/avg-1)*100)}% acima da média (${fmt(+l.valor)} contra ${fmt(avg)}). Vale dar uma olhada.`,itens:[l,...prev]});
  }
  // 7. parcelas comprometendo o próximo mês
  const nk=ymAdd(cur,1),comp=lancsFat.filter(l=>l.fatura===nk&&l.parcela).reduce((a,l)=>a+(+l.valor||0),0);
  const ks=Object.keys(meses).filter(k=>k<cur).sort().slice(-3),rendaRef=fixas.filter(f=>f.tipo==="entrada").reduce((a,f)=>a+(+f.valor||0),0)||(ks.length?ks.reduce((a,k)=>a+meses[k].e,0)/ks.length:0);
  if(rendaRef>0&&comp/rendaRef>=.25)out.push({id:"parcelas",prio:70,txt:`${Math.round(comp/rendaRef*100)}% da renda de ${MESES[+nk.slice(5)-1]} já está comprometida com parcelas no cartão (${fmt0(comp)}). Melhor evitar novas parcelas por enquanto.`,acao:{t:"cartoes",lbl:"Ver cartões"}});
  // 8. efeito salário
  const sal=mes.filter(l=>l.tipo==="entrada"&&l.cat==="Salário").sort((a,b)=>a.data.localeCompare(b.data))[0];
  if(sal){const sd=+sal.data.slice(8);const vv=saidas.filter(variavel),tv=vv.reduce((a,l)=>a+(+l.valor||0),0);
    const jan=vv.filter(l=>{const d=+l.data.slice(8);return d>=sd&&d<=sd+4}).reduce((a,l)=>a+(+l.valor||0),0);
    if(dia-sd>=10&&tv>=300&&vv.length>=8&&jan/tv>=.5)out.push({id:"salario",prio:30,txt:`${Math.round(jan/tv*100)}% dos gastos do mês saíram nos 5 dias depois do salário. Separar logo o que vai para as contas e para as metas ajuda o dinheiro a durar.`,acao:{t:"metas",lbl:"Ir para Metas"}})}
  // 9. reserva de emergência
  const media=ks.length?ks.reduce((a,k)=>a+meses[k].s,0)/ks.length:0,guard=metas.reduce((a,m)=>a+saldoMeta(m.id),0);
  if(ks.length>=2&&media>0&&guard<media)out.push({id:"reserva",prio:25,txt:`Que tal uma reserva de emergência? O ideal é juntar de 3 a 6 meses de gastos: algo entre ${fmt0(media*3)} e ${fmt0(media*6)}.`,acao:{t:"meta",lbl:"Criar a reserva",v:{nome:"Reserva de emergência",alvo:vIn(r10(media*3)),prazo:""}}});
  // filtros
  return out.filter(d=>{const tipo=d.id.split("-")[0];if((dicasCfg.off||{})[tipo]||(dicasCfg.off||{})[d.id])return false;const ad=(dicasCfg.adiadas||{})[d.id+"@"+cur];return !(ad&&ad>=h)})
    .sort((a,b)=>b.prio-a.prio).slice(0,3);
}

const diffDias=(a,b)=>Math.round((Date.UTC(+a.slice(0,4),+a.slice(5,7)-1,+a.slice(8,10))-Date.UTC(+b.slice(0,4),+b.slice(5,7)-1,+b.slice(8,10)))/864e5);
function vencimentos(){
  const T=hoje(),cur=curYm(),dias=+config.avisoDias||3,out=[];
  for(const k of [ymAdd(cur,-1),cur,ymAdd(cur,1)]){
    for(const f of fixas){
      if(f.tipo==="entrada"||!f.dia||f.cartao||(f.desde||"0000-00")>k||fixaStatus(f,k))continue;
      const due=k+"-"+pad(Math.min(f.dia,lastDay(k))),dd=diffDias(due,T);
      if(dd<=dias)out.push({nome:f.nome,valor:+f.valor||0,due,dd,tab:"fixas",k});
    }
    for(const c of cartoes){
      if((faturasPg[k]||{})[c.id])continue;
      const tot=lancsFat.filter(l=>l.cartao===c.id&&l.fatura===k).reduce((a,l)=>a+(+l.valor||0),0);
      if(!(tot>0))continue;
      const due=vencDe(k,c),dd=diffDias(due,T);
      if(dd<=dias)out.push({nome:"Fatura "+c.nome,valor:tot,due,dd,tab:"cartoes",k});
    }
  }
  return out.sort((a,b)=>a.dd-b.dd);
}
function quando(dd){return dd<0?(dd===-1?"venceu ontem":"atrasada há "+(-dd)+" dias"):dd===0?"vence hoje":dd===1?"vence amanhã":"vence em "+dd+" dias"}

  <div class="hint">Toque para marcar como paga.</div></section>`;

function telaMes(){
  const k=ymKey(),arr=doMes(ym.y,ym.m),t=totais(arr),cur=curYm(),ehAtual=k===cur;
  if(ehAtual)dicasAtuais=calcDicas();
  const pct=t.e>0?Math.min(100,Math.round(t.s/t.e*100)):0;
  const diasRest=ehAtual?lastDay(k)-NOW().getDate()+1:0;
  const abertasS=fixas.filter(f=>f.tipo!=="entrada"&&!fixaStatus(f,k)).reduce((a,f)=>a+(+f.valor||0),0);
  const abertasE=fixas.filter(f=>f.tipo==="entrada"&&!fixaStatus(f,k)).reduce((a,f)=>a+(+f.valor||0),0);
  let msg;
  if(!arr.length)msg="Nada lançado neste mês ainda. Comece pelo salário em “+ Lançar”.";
  else if(t.e===0&&!abertasE)msg="Lance as entradas (salários) para ver se o mês fecha.";
  else if(ehAtual){const livre=t.saldo-abertasS+abertasE;
    msg=livre<0?"Contando o que ainda falta pagar e receber, o mês fecha em "+fmt(livre)+".":"Dá para gastar cerca de "+fmt0(livre/diasRest)+" por dia até o fim do mês."+(abertasS||abertasE?" (já contando as fixas que faltam)":"")}
  else msg=t.saldo<0?"Saiu mais do que entrou: faltaram "+fmt(-t.saldo)+".":"O mês fechou com "+fmt(t.saldo)+" de sobra.";
  const saidas=arr.filter(l=>l.tipo==="saida");
  const porCat={};saidas.forEach(l=>porCat[l.cat||"Outros"]=(porCat[l.cat||"Outros"]||0)+(+l.valor||0));
  const cats=Object.keys(porCat).sort((a,b)=>porCat[b]-porCat[a]);
  const maxC=Math.max(1,...cats.map(c=>porCat[c]));
  const catsHtml=cats.length?cats.map(c=>{const lim=+config.limites[c]||0,v=porCat[c],over=lim&&v>lim,w=Math.min(100,v/(lim||maxC)*100);
    return `<button class="cat${over?" over":""}" data-a="filtro" data-k="cat" data-v="${esc(c)}"><span class="t">${esc(c)}</span><span class="v num">${fmt(v)}</span>
    <span class="track"><i style="width:${w}%"></i></span>
    ${lim?`<span class="lim num">${over?"Passou "+fmt(v-lim)+" do limite de "+fmt(lim):"Restam "+fmt(lim-v)+" de "+fmt(lim)}</span>`:""}</button>`}).join(""):`<div class="empty">As saídas aparecem aqui, agrupadas por categoria. Toque numa categoria para ver os gastos dela.</div>`;
  const porQuem={};saidas.forEach(l=>porQuem[l.quem||"—"]=(porQuem[l.quem||"—"]||0)+(+l.valor||0));

function telaAno(){

    return `<div class="yrow"><span style="text-transform:capitalize">${MESES[i].slice(0,3)}</span>

      <span class="s num ${vazio?"":t.saldo<0?"v out":"v in"}">${vazio?"—":fmt0(t.saldo)}</span></div>`}).join("");
  const tot=totais(lancs),meses=rows.filter(t=>t.e||t.s).length,neg=rows.filter(t=>(t.e||t.s)&&t.saldo<0).length;
  return `<div class="wrap">

}

function telaCartoes(){
  const k=ymKey();
  if(!cartoes.length)return `<div class="wrap"><section class="card"><h2>Cartões de crédito</h2>
    <div class="empty">Cadastre seus cartões com o dia de fechamento e de vencimento. Depois, ao lançar uma compra, escolha o cartão e o número de parcelas: o app mostra cada fatura e o que já está comprometido nos próximos meses.</div>
    <button class="btn" data-a="cartao">+ Cadastrar cartão</button></section></div>`;
  const hojeS=hoje();
  const cards=cartoes.map(c=>{
    const itens=lancsFat.filter(l=>l.cartao===c.id&&l.fatura===k);
    const total=itens.reduce((a,l)=>a+(+l.valor||0),0);
    const pago=!!(faturasPg[k]||{})[c.id];
    const venc=vencDe(k,c),fech=fechamentoDe(k,c);
    let pill;
    if(pago)pill=`<span class="pill ok">Paga</span>`;
    else if(hojeS>venc&&total>0)pill=`<span class="pill bad">Vencida</span>`;
    else if(hojeS>fech)pill=`<span class="pill warn">Fechada</span>`;
    else pill=`<span class="pill">Aberta · fecha ${dBr(fech)}</span>`;
    const prox=[1,2,3].map(n=>{const kk=ymAdd(k,n);return{kk,v:lancsFat.filter(l=>l.cartao===c.id&&l.fatura===kk).reduce((a,l)=>a+(+l.valor||0),0)}});
    let limHtml="";
    if(+c.limite>0){const usado=lancsFat.filter(l=>l.cartao===c.id&&l.fatura>=curYm()&&!(faturasPg[l.fatura]||{})[c.id]).reduce((a,l)=>a+(+l.valor||0),0);
      const pct=Math.min(100,usado/c.limite*100);
      limHtml=`<div class="hrow"><small>Limite usado</small><small class="num">${fmt(usado)} de ${fmt(+c.limite)}</small></div><div class="prog"><i style="width:${pct}%;background:${pct>85?"var(--out)":"var(--accent)"}"></i></div>`}
    return `<section class="card">
      <div class="cc-top"><div style="display:flex;flex-direction:column;gap:4px;min-width:0"><h2>💳 ${esc(c.nome)}</h2><div>${pill}</div></div>
      <button class="lnk" data-a="cartao" data-id="${esc(c.id)}">editar</button></div>
      <div><div class="hint">Fatura de ${MESES[+k.slice(5)-1]} · vence ${dBr(venc)}</div><div class="cc-total num">${fmt(total)}</div></div>
      ${limHtml}
      <div class="mini num">${prox.map(p=>`<div><span>${ymCurto(p.kk)}</span><strong>${fmt0(p.v)}</strong></div>`).join("")}</div>
      ${itens.length?`<div>${sortDesc(itens).map(itemHtml).join("")}</div>`:`<div class="empty">Nenhuma compra nesta fatura.</div>`}
      ${total>0?`<button class="btn ${pago?"ghost":""}" data-a="pagarFatura" data-id="${esc(c.id)}">${pago?"Desmarcar pagamento":"Marcar fatura como paga"}</button>`:""}
    </section>`}).join("");
  return `<div class="wrap">${cards}
    <section class="card"><div class="hint">As compras no cartão contam no mês em que foram feitas (cada parcela no seu mês). Aqui você vê quanto vai vir em cada fatura.</div>
    <button class="btn ghost" data-a="cartao">+ Cadastrar outro cartão</button></section></div>`;
}

function telaFixas(){
  const k=ymKey(),hojeS=hoje(),ehAtual=k===curYm();
  const linha=f=>{const st=fixaStatus(f,k),ent=f.tipo==="entrada";
    const late=!st&&ehAtual&&f.dia&&NOW().getDate()>f.dia;
    const meta=[fmt(+f.valor||0)];if(f.dia)meta.push("dia "+f.dia);if(f.auto)meta.push("automático");if(f.cartao)meta.push("💳 "+nomeCartao(f.cartao));
    if(late)meta.push(ent?"não recebida":"atrasada");
    return `<div class="fixa${st?" pago":""}"><button class="chk" data-a="pagarFixa" data-id="${esc(f.id)}" aria-label="${st?"Desmarcar":(ent?"Marcar como recebida":"Marcar como paga")}">${st?"✓":""}</button>
    <span class="n">${esc(f.nome)}</span><span class="m num${late?" late":""}">${esc(meta.join(" · "))}</span>
    <span class="x"><button class="lnk" data-a="fixa" data-id="${esc(f.id)}">editar</button></span></div>`};
  const ent=fixas.filter(f=>f.tipo==="entrada"),sai=fixas.filter(f=>f.tipo!=="entrada");
  const abertoS=sai.filter(f=>!fixaStatus(f,k)).reduce((a,f)=>a+(+f.valor||0),0);
  const abertoE=ent.filter(f=>!fixaStatus(f,k)).reduce((a,f)=>a+(+f.valor||0),0);
  return `<div class="wrap">
  <section class="card"><div class="hrow"><h2>Entradas fixas</h2><small class="num">${abertoE?"falta receber "+fmt(abertoE):ent.length?"tudo recebido":""}</small></div>
    ${ent.map(linha).join("")||`<div class="empty">Salários e outras rendas que se repetem. Com “automático” ligado, entram sozinhas no dia certo de cada mês.</div>`}</section>
  <section class="card"><div class="hrow"><h2>Contas fixas</h2><small class="num">${abertoS?"falta pagar "+fmt(abertoS):sai.length?"tudo pago":""}</small></div>
    ${sai.map(linha).join("")||`<div class="empty">Aluguel, luz, água, internet, assinaturas… Ao marcar como paga, a conta entra nos lançamentos do mês.</div>`}</section>
  <button class="btn" data-a="fixa">+ Nova entrada ou conta fixa</button>
  <div class="hint">Para ${MESES[ym.m-1]}: toque no quadradinho para marcar como paga/recebida. Desmarcar apaga o lançamento do mês.</div>
  </div>`;
}

function telaMetas(){

    else if(alvo&&m.prazo)dica="O prazo passou. Faltam "+fmt(alvo-s)+".";
    else if(alvo)dica="Faltam "+fmt(alvo-s)+".";
    return `<section class="card">
      <div class="cc-top"><h2>${esc(m.nome)}</h2><button class="lnk" data-a="meta" data-id="${esc(m.id)}">editar</button></div>
      <div class="hrow"><span class="cc-total num">${fmt(s)}</span><small class="num">${alvo?"de "+fmt(alvo):""}</small></div>

      <div class="row"><button class="btn sm" data-a="mov" data-id="${esc(m.id)}" data-v="guardar">Guardar</button><button class="btn sm ghost" data-a="mov" data-id="${esc(m.id)}" data-v="retirar" ${s>0?"":"disabled"}>Retirar</button></div>
    </section>`}).join("");
  return `<div class="wrap">
    ${metas.length?`<div class="saldo"><small>Total guardado</small><div class="big num">${fmt(total)}</div><div class="msg">${metas.length} ${metas.length>1?"metas":"meta"}. O que você guarda sai do “Sobrou no mês”, mas não conta como gasto.</div></div>`:""}

    <button class="btn" data-a="meta">+ Nova meta</button></div>`;
}

let S=null;
function openSheet(mode,v,extra){S=Object.assign({mode,v:Object.assign({},v)},extra||{});drawSheet();$("#scrim").hidden=false;$("#sheet").hidden=false;$("#sheet").scrollTop=0}

function syncInputs(){if(!S)return;document.querySelectorAll("#sheetBody [data-k]").forEach(i=>{if(i.tagName==="BUTTON")return;S.v[i.dataset.k]=i.type==="checkbox"?i.checked:i.value})}
const chips=(k,opts,cur,labels)=>`<div class="chips">${opts.map((o,i)=>`<button type="button" data-a="set" data-k="${k}" data-v="${esc(o)}" class="${o===cur?"on":""}">${esc(labels?labels[i]:o)}</button>`).join("")}</div>`;
const lbl=t=>`<div class="day">${t}</div>`;
const head=t=>`<div class="hrow"><h2>${t}</h2><button class="lnk" data-a="fechar">fechar</button></div>`;
const errBox=`<div id="sErr" class="note err" hidden></div>`;
function sErr(t){const e=$("#sErr");if(e){e.hidden=!t;e.textContent=t||""}}

function drawSheet(){
  const b=$("#sheetBody"),v=S.v;
  if(S.mode==="list"){
    const tot=S.items.reduce((a,l)=>a+(+l.valor||0),0);
    b.innerHTML=head(esc(S.title))+`<div class="hrow"><small>${S.items.length} lançamento${S.items.length!==1?"s":""}${S.semMes?"":" em "+esc(ymNome(ymKey()))}</small><strong class="num">${fmt(tot)}</strong></div><div>${listaPorDia(S.items)}</div>`;return}
  if(S.mode==="lanc"){
    const meta=v.tipo==="meta",cats=v.tipo==="entrada"?CATS_ENTRADA:CATS_SAIDA;
    if(!meta&&!cats.includes(v.cat))v.cat=cats[0];
    const card=v.tipo==="saida"&&v.forma!=="conta"&&cartoes.find(c=>c.id===v.forma);
    if(v.tipo!=="saida")v.forma="conta";
    const orig=S.orig||{};
    b.innerHTML=head(meta?"Movimento da meta":v.id?"Editar lançamento":"Novo lançamento")+
    (meta?`<div class="hint">${orig.mov==="retirar"?"Retirada de":"Guardado em"} <b>${esc(nomeMeta(orig.meta))}</b></div>`:`<div class="seg"><button type="button" data-a="set" data-k="tipo" data-v="saida" class="${v.tipo==="saida"?"on":""}">Saiu</button><button type="button" data-a="set" data-k="tipo" data-v="entrada" class="${v.tipo==="entrada"?"on":""}">Entrou</button></div>`)+
    `<div class="valor"><span>R$</span><input id="fValor" data-k="valor" class="num" inputmode="decimal" placeholder="0,00" value="${esc(v.valor)}" aria-label="Valor${card&&!v.id?" total":""}"></div>`+
    (meta?"":lbl("Categoria")+chips("cat",cats,v.cat))+
    lbl("Quem")+chips("quem",quemOpts(),v.quem)+
    (v.tipo==="saida"?lbl("Pagamento")+chips("forma",["conta",...cartoes.map(c=>c.id)],v.forma,["Pix / débito / dinheiro",...cartoes.map(c=>"💳 "+c.nome)]):"")+

    hintFatura();return}
  if(S.mode==="fixa"){
    const ent=v.tipo==="entrada",cats=ent?CATS_ENTRADA:CATS_SAIDA;if(!cats.includes(v.cat))v.cat=ent?"Salário":"Contas da casa";

    <label class="f">Nome<input class="in" data-k="nome" placeholder="${ent?"Ex.: Salário Sahar":"Ex.: Luz (Celesc)"}" value="${esc(v.nome)}"></label>

    <label class="f">${ent?"Cai no dia":"Vence dia"}<input class="in num" data-k="dia" inputmode="numeric" placeholder="10" value="${esc(v.dia)}"></label></div>`+
    lbl("Categoria")+chips("cat",cats,v.cat)+lbl("Quem")+chips("quem",quemOpts(),v.quem)+
    (!ent&&cartoes.length?lbl("Pagamento")+chips("cartao",["",...cartoes.map(c=>c.id)],v.cartao||"",["Pix / débito / boleto",...cartoes.map(c=>"💳 "+c.nome)]):"")+
    `<label class="tg"><input type="checkbox" data-k="auto" ${v.auto?"checked":""}> Lançar sozinho todo mês, no dia</label>
    <div class="hint">Desligado: você marca na lista quando pagar. Ligado: entra sozinho a partir deste mês (se já lançou neste mês, desmarque na lista para não duplicar).</div>`+

  if(S.mode==="cartao"){
    b.innerHTML=head(v.id?"Editar cartão":"Novo cartão")+
    `<label class="f">Nome do cartão<input class="in" data-k="nome" placeholder="Ex.: Nubank" value="${esc(v.nome)}"></label>

    errBox+`<div class="row">${v.id?`<button class="btn danger" data-a="excluirCartao">Excluir</button>`:""}<button class="btn" data-a="salvarCartao">Salvar</button></div>`;return}
  if(S.mode==="meta"){
    b.innerHTML=head(v.id?"Editar meta":"Nova meta")+
    `<label class="f">Nome<input class="in" data-k="nome" placeholder="Ex.: Reserva de emergência" value="${esc(v.nome)}"></label>
    <div class="grid2"><label class="f">Quanto quer juntar<input class="in num" data-k="alvo" inputmode="decimal" placeholder="opcional" value="${esc(v.alvo)}"></label>

function editLanc(l){
  openSheet("lanc",{id:l.id,tipo:l.tipo,valor:vIn(l.valor),cat:l.cat,quem:l.quem,data:l.data,desc:l.desc||"",forma:l.cartao||"conta",parcelas:1},{orig:l});
}
function salvarLanc(){
  const v=S.v,orig=S.orig||{},val=parseValor(v.valor);
  if(!(val>0))return sErr("Digite o valor, por exemplo 45,90.");
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v.data))return sErr("Escolha a data.");
  if(v.tipo==="meta"){
    if(orig.mov==="retirar"&&val>saldoMeta(orig.meta)+(+orig.valor||0)+0.001)return sErr("Não dá para retirar mais do que está guardado.");
    put("lanc",v.id,Object.assign({},stripId(orig),{valor:val,data:v.data,quem:v.quem||"",desc:v.desc.trim().slice(0,80)}));marcarDia();return done(v.data)}
  const card=v.tipo==="saida"&&cartoes.find(c=>c.id===v.forma);
  const base={data:v.data,tipo:v.tipo,valor:val,cat:v.cat,quem:v.quem||"",desc:v.desc.trim().slice(0,80),criadoEm:orig.criadoEm||Date.now()};
  if(orig.fixa)base.fixa=orig.fixa;
  if(orig.parcela)base.parcela=orig.parcela;
  if(card){base.cartao=card.id;base.fatura=faturaDe(v.data,card)}
  if(v.quem)ls.set("quem",v.quem);if(v.tipo==="saida")ls.set("forma",v.forma);
  const n=Math.max(1,Math.min(36,parseInt(v.parcelas,10)||1));
  if(!v.id&&card&&n>1){
    const g=newId("lanc"),per=Math.floor(val/n*100)/100,desc=base.desc||base.cat;
    for(let i=0;i<n;i++){const d=addMonths(v.data,i);
      put("lanc",g+"-"+(i+1),Object.assign({},base,{data:d,valor:i===n-1?r2(val-per*(n-1)):per,desc:desc+" ("+(i+1)+"/"+n+")",fatura:faturaDe(d,card),parcela:{i:i+1,n,grupo:g},criadoEm:Date.now()+i}))}
  }else put("lanc",v.id||newId("lanc"),base);
  marcarDia();done(v.data);
}
const stripId=o=>{const c=Object.assign({},o);delete c.id;return c};
function done(ds){closeSheet();if(tab==="mes"||tab==="ano"){const [y,m]=ds.split("-").map(Number);if(y!==ym.y||m!==ym.m){ym={y,m};mudouMes()}}render()}
function excluirLanc(l){
  del("lanc",l.id);
  if(l.fixa)put("pagos",l.data.slice(0,7),{[l.fixa]:"pulado"},true);
  closeSheet();render();
}
async function excluirParcelas(l){
  const g=l.parcela.grupo;
  let ids=[];
  try{const s=await getDocs(query(col("lanc"),where("parcela.grupo","==",g)));ids=s.docs.map(d=>d.id)}catch(e){}
  for(let i=1;i<=l.parcela.n;i++)ids.push(g+"-"+i);
  [...new Set(ids)].forEach(id=>del("lanc",id));
  closeSheet();render();
}
function salvarFixa(){
  const v=S.v,val=parseValor(v.valor),dia=parseInt(v.dia,10);
  if(!String(v.nome||"").trim())return sErr("Dê um nome, por exemplo “Aluguel”.");
  if(!(val>0))return sErr("Digite o valor.");
  if(v.dia&&!(dia>=1&&dia<=31))return sErr("O dia vai de 1 a 31.");
  const old=fixas.find(f=>f.id===v.id)||{};
  const body={nome:v.nome.trim().slice(0,60),tipo:v.tipo==="entrada"?"entrada":"saida",valor:val,dia:dia||null,cat:v.cat,quem:v.quem||"Casal",cartao:v.tipo==="entrada"?"":(v.cartao||""),auto:!!v.auto,desde:old.desde||curYm(),criadoEm:old.criadoEm||Date.now()};
  if(body.auto&&!old.auto)body.desde=curYm();
  put("fixas",v.id||newId("fixas"),body);closeSheet();
}
function salvarCartao(){
  const v=S.v,fech=parseInt(v.fech,10),venc=parseInt(v.venc,10),lim=parseValor(v.limite);
  if(!String(v.nome||"").trim())return sErr("Dê um nome ao cartão.");
  if(!(fech>=1&&fech<=31)||!(venc>=1&&venc<=31))return sErr("Preencha os dias de fechamento e vencimento (1 a 31).");
  const old=cartoes.find(c=>c.id===v.id)||{};
  put("cartoes",v.id||newId("cartoes"),{nome:v.nome.trim().slice(0,40),fech,venc,limite:lim>0?lim:0,criadoEm:old.criadoEm||Date.now()});closeSheet();
}
function salvarMeta(){
  const v=S.v,alvo=parseValor(v.alvo);
  if(!String(v.nome||"").trim())return sErr("Dê um nome à meta.");
  const old=metas.find(m=>m.id===v.id)||{};
  put("metas",v.id||newId("metas"),{nome:v.nome.trim().slice(0,50),alvo:alvo>0?alvo:0,prazo:/^\d{4}-\d{2}$/.test(v.prazo||"")?v.prazo:"",criadoEm:old.criadoEm||Date.now()});closeSheet();
}
function salvarMov(){
  const v=S.v,val=parseValor(v.valor);
  if(!(val>0))return sErr("Digite o valor.");
  if(v.mov==="retirar"&&val>saldoMeta(v.meta)+0.001)return sErr("Não dá para retirar mais do que está guardado ("+fmt(saldoMeta(v.meta))+").");
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v.data))return sErr("Escolha a data.");
  put("lanc",newId("lanc"),{data:v.data,tipo:"meta",mov:v.mov,meta:v.meta,valor:val,cat:"Metas",quem:v.quem||"",desc:"",criadoEm:Date.now()});
  marcarDia();closeSheet();
}
function toggleFixa(f){

/* ================= exportar ================= */
function loadXLSX(){
  if(window.XLSX)return Promise.resolve(window.XLSX);
  return new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=()=>res(window.XLSX);s.onerror=()=>rej(new Error("xlsx"));document.head.appendChild(s)});
}
const serial=ds=>{const [y,m,d]=ds.split("-").map(Number);return (Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/86400000};
async function exportar(escopo,btn){
  const old=btn.textContent;btn.disabled=true;btn.textContent="Gerando…";
  try{
    const X=await loadXLSX();
    const arr=sortDesc(escopo==="mes"?doMes(ym.y,ym.m):lancs).reverse();
    const nome=escopo==="mes"?ymNome(ymKey()):String(ym.y);
    const BRL='"R$" #,##0.00;[Red]-"R$" #,##0.00';
    const wb=X.utils.book_new();
    const rows=[["Data","Tipo","Categoria","Descrição","Valor (R$)","Quem","Pagamento","Fatura"]];
    for(const l of arr){
      const tipo=l.tipo==="entrada"?"Entrada":l.tipo==="meta"?(l.mov==="retirar"?"Retirada de meta":"Guardado em meta"):"Saída";
      rows.push([serial(l.data),tipo,l.tipo==="meta"?nomeMeta(l.meta):l.cat||"",l.desc||"",+l.valor||0,l.quem||"",l.cartao?"Cartão "+nomeCartao(l.cartao):(l.tipo==="saida"?"Pix/débito/dinheiro":""),l.fatura?ymNome(l.fatura):""]);
    }
    const ws=X.utils.aoa_to_sheet(rows);
    for(let r=1;r<rows.length;r++){const a=ws[X.utils.encode_cell({r,c:0})];a.t="n";a.z="dd/mm/yyyy";const b=ws[X.utils.encode_cell({r,c:4})];b.z=BRL}
    ws["!cols"]=[{wch:11},{wch:16},{wch:20},{wch:30},{wch:13},{wch:10},{wch:20},{wch:16}];
    ws["!autofilter"]={ref:"A1:H"+rows.length};
    X.utils.book_append_sheet(wb,ws,"Lançamentos");
    const t=totais(arr),res=[["Resumo — "+nome,""],["Entrou",t.e],["Saiu",t.s],["Guardou em metas",t.g],["Sobrou",t.saldo],["",""],["Saídas por categoria","Valor (R$)"]];
    const pc={};arr.filter(l=>l.tipo==="saida").forEach(l=>pc[l.cat||"Outros"]=(pc[l.cat||"Outros"]||0)+(+l.valor||0));
    Object.keys(pc).sort((a,b)=>pc[b]-pc[a]).forEach(c=>res.push([c,pc[c]]));
    res.push(["",""],["Saídas por pessoa","Valor (R$)"]);
    const pq={};arr.filter(l=>l.tipo==="saida").forEach(l=>pq[l.quem||"—"]=(pq[l.quem||"—"]||0)+(+l.valor||0));
    Object.keys(pq).forEach(q=>res.push([q,pq[q]]));
    if(escopo==="ano"){res.push(["",""],["Mês","Entrou","Saiu","Guardou","Sobrou"]);
      for(let m=1;m<=12;m++){const tt=totais(doMes(ym.y,m));res.push([MESES[m-1],tt.e,tt.s,tt.g,tt.saldo])}}
    const ws2=X.utils.aoa_to_sheet(res);
    Object.keys(ws2).forEach(k=>{if(k[0]!=="!"&&ws2[k].t==="n")ws2[k].z=BRL});
    ws2["!cols"]=[{wch:24},{wch:15},{wch:15},{wch:15},{wch:15}];
    X.utils.book_append_sheet(wb,ws2,"Resumo");
    const out=X.write(wb,{bookType:"xlsx",type:"array"});
    const fname="Contas da Casa - "+nome+".xlsx";
    const blob=new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    const file=new File([blob],fname,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:fname})}catch(e){}
    }else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
  }catch(e){setStatus("Não consegui gerar o Excel. Na primeira vez é preciso estar com internet.",true)}
  btn.disabled=false;btn.textContent=old;
}

      if(v.tipo==="limite_cat"||v.tipo==="sem_cat")body.cat=v.cat;if(precisaVal)body.valor=val;
      put("desafios",newId("desafios"),body);closeSheet();break}
    case "desistir":if(!t.classList.contains("armed")){t.classList.add("armed");t.textContent="toque de novo";break}del("desafios",id);break;
    case "salvarAjustes":salvarAjustes(t);break;
    case "export":exportar(val,t);break;
    case "sair":window.__logout&&window.__logout();break;
    case "irVenc":{const [y,m]=t.dataset.k.split("-").map(Number);ym={y,m};tab=val;ls.set("tab",tab);mudouMes();render();window.scrollTo(0,0);break}
    case "ativarPush":ativarPush(t);break;
  }
});

/* ================= notificações ================= */
const temVapid=()=>!!(CFG.vapidKey&&!String(CFG.vapidKey).startsWith("COLE"));
const standalone=()=>window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
function pushSuporte(){return "Notification" in window&&"serviceWorker" in navigator&&"PushManager" in window}
function pushUI(){
  const pill=$("#pushPill"),txt=$("#pushTxt"),btn=$("#pushBtn");if(!pill)return;
  btn.hidden=true;
  if(!temVapid()){pill.innerHTML=`<span class="pill">não configurado</span>`;txt.textContent="Falta colocar a chave de notificações (vapidKey) no config.js.";return}
  if(!pushSuporte()){pill.innerHTML=`<span class="pill warn">indisponível</span>`;txt.textContent=standalone()?"Este aparelho não aceita notificações de app web (precisa do iOS 16.4 ou mais novo).":"Abra o app pelo ícone da Tela de Início para ativar as notificações.";return}
  const p=Notification.permission;
  if(p==="granted"){pill.innerHTML=`<span class="pill ok">ativadas</span>`;txt.textContent=ls.get("pushOk","")?"Este iPhone vai receber os avisos de vencimento.":"Permissão dada. Registrando este aparelho…";if(!ls.get("pushOk",""))registrarPush().then(pushUI,()=>{});return}
  if(p==="denied"){pill.innerHTML=`<span class="pill bad">bloqueadas</span>`;txt.textContent="As notificações foram bloqueadas. Para liberar: Ajustes do iPhone → Notificações → Contas → Permitir Notificações.";return}
  pill.innerHTML=`<span class="pill">desligadas</span>`;txt.textContent="Receba um aviso quando uma conta ou fatura estiver para vencer, mesmo com o app fechado.";btn.hidden=false;
}
async function registrarPush(){
  const M=await import(MSG_URL);
  if(!(await M.isSupported()))throw new Error("nao-suporta");
  const reg=await navigator.serviceWorker.ready;
  const token=await M.getToken(M.getMessaging(fbApp),{vapidKey:CFG.vapidKey,serviceWorkerRegistration:reg});
  if(!token)throw new Error("sem-token");
  if(ls.get("pushTok","")!==token){
    const old=ls.get("pushTok","");if(old)del("push",old);
    put("push",token,{token,email:window.__email||"",atualizado:Date.now(),aparelho:navigator.userAgent.slice(0,140)});
    ls.set("pushTok",token);
  }
  ls.set("pushOk","1");
}
function ativarPush(btn){
  btn.disabled=true;btn.textContent="Aguarde…";
  Notification.requestPermission().then(async p=>{
    if(p==="granted"){try{await registrarPush()}catch(e){$("#pushTxt").textContent="Não consegui registrar este aparelho ("+(e.code||e.message)+"). Tente de novo com internet."}}
    btn.disabled=false;btn.textContent="Ativar notificações";pushUI();
  });
}

/* ================= login ================= */
if(!firebaseConfig||!firebaseConfig.apiKey||firebaseConfig.apiKey.startsWith("COLE")){setStatus("Falta configurar o arquivo config.js com os dados do Firebase.",true)}
else{
  const app=fbApp=initializeApp(firebaseConfig);
  const auth=getAuth(app);
  fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
  const showErr=t=>{const e=$("#lgErr");e.hidden=!t;e.textContent=t||""};
  onAuthStateChanged(auth,u=>{
    if(!u){window.__ok=true;$("#login").hidden=false;setStatus("");return}
    const ok=!emailsPermitidos||!emailsPermitidos.length||emailsPermitidos.map(x=>x.toLowerCase()).includes((u.email||"").toLowerCase());
    if(!ok){signOut(auth);showErr("Este e-mail não está na lista de acesso.");return}
    window.__email=u.email;$("#login").hidden=true;
    if(!started){started=true;setStatus("Carregando…");startData();if(temVapid()&&pushSuporte()&&Notification.permission==="granted")setTimeout(()=>registrarPush().catch(()=>{}),3000)}
  });
  $("#loginForm").addEventListener("submit",async ev=>{ev.preventDefault();showErr("");
    const b=$("#lgBtn");b.disabled=true;b.textContent="Entrando…";
    try{await signInWithEmailAndPassword(auth,$("#lgEmail").value.trim(),$("#lgSenha").value)}
    catch(e){showErr(e.code==="auth/network-request-failed"?"Sem internet. O primeiro acesso precisa de conexão.":["auth/invalid-credential","auth/wrong-password","auth/user-not-found","auth/invalid-email"].includes(e.code)?"E-mail ou senha incorretos.":"Não foi possível entrar ("+e.code+").")}
    b.disabled=false;b.textContent="Entrar"});
  window.__logout=()=>{signOut(auth).then(()=>location.reload())};
}
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
